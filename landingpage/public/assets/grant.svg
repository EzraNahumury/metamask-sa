<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke="#ededed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- cap boundary (revocable scope) -->
  <rect x="58" y="74" width="284" height="252" rx="28" stroke="#8c8c8c" stroke-width="2" stroke-dasharray="7 11"/>
  <!-- permission card -->
  <rect x="100" y="112" width="200" height="176" rx="18"/>
  <!-- coin -->
  <circle cx="200" cy="174" r="42"/>
  <text x="200" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="46" font-weight="600" fill="#ededed" stroke="none">$</text>
  <!-- weekly budget bars -->
  <path d="M150 244 h100"/>
  <path d="M150 262 h74" stroke="#8c8c8c" stroke-width="2"/>
  <path d="M150 280 h48" stroke="#8c8c8c" stroke-width="2"/>
